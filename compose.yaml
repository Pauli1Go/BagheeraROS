services:
  bagheera-base:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MOWGLI_IMAGE: ghcr.io/mowglinext/mowglinext/mowgli-ros2:1.1.0
    image: bagheera-ros:local
    container_name: bagheera-base
    entrypoint: /bagheera_entrypoint.sh
    network_mode: host
    ipc: host
    privileged: true
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: SUBNET
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./src/bagheera_base/config:/bagheera_ws/install/share/bagheera_base/config:ro
      - ./maps:/bagheera_ws/maps
    restart: unless-stopped
    stop_grace_period: 2s
