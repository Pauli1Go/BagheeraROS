services:
  bagheera-base:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MOWGLI_IMAGE: ghcr.io/mowglinext/mowglinext/mowgli-ros2:1.1.0
    image: bagheera-ros:local
    container_name: bagheera-base
    entrypoint: /bagheera_entrypoint.sh
    command: ["ros2", "launch", "bagheera_base", "manual_control.launch.py"]
    network_mode: host
    ipc: host
    privileged: true
    environment:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      # ROS traffic stays on the loopback interface. On wlan0 every WiFi drop
      # (roaming, DHCP renew) removed the address DDS was bound to and froze
      # all node-to-node traffic inside the robot for seconds. Foxglove
      # reaches the robot over its WebSocket (port 8765), not over DDS.
      # LOCALHOST makes rmw_cyclonedds use unicast discovery via localhost
      # (auto participant index); the limit is raised above the ~35 processes.
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      CYCLONEDDS_URI: '<CycloneDDS><Domain><General><Interfaces><NetworkInterface name="lo"/></Interfaces></General><Discovery><MaxAutoParticipantIndex>120</MaxAutoParticipantIndex></Discovery></Domain></CycloneDDS>'
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - ./src/bagheera_base/config:/bagheera_ws/install/share/bagheera_base/config:ro
      # Python nodes, launch files and behavior trees run straight from the checkout: changes
      # need only `docker compose restart`. New executables (setup.py) and the
      # C++ dock plugin still need `docker compose build`.
      - ./src/bagheera_base/bagheera_base:/bagheera_ws/install/lib/python3.12/site-packages/bagheera_base:ro
      - ./src/bagheera_base/launch:/bagheera_ws/install/share/bagheera_base/launch:ro
      - ./src/bagheera_base/behavior_trees:/bagheera_ws/install/share/bagheera_base/behavior_trees:ro
      - ./maps:/bagheera_ws/maps
      - ./test_logs:/bagheera_ws/test_logs
    restart: unless-stopped
    stop_grace_period: 2s
