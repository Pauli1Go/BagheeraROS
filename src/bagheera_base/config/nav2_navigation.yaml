bt_navigator:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 100
    wait_for_service_timeout: 5000
    service_introspection_mode: disabled
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
      enable_groot_monitoring: false
      groot_server_port: 1667
    bt_search_directories:
      - /opt/ros/kilted/share/nav2_bt_navigator/behavior_trees
    error_code_name_prefixes:
      - backup
      - compute_path
      - follow_path
      - nav_to_pose
      - wait

controller_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    enable_stamped_cmd_vel: true
    controller_frequency: 15.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      # Unlike SimpleProgressChecker, this counts an in-place turn as real
      # progress and therefore does not trigger recovery during final yaw
      # alignment. A robot that does not translate or rotate still times out.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.10
      # In-place rotations are legitimate progress: a 180 deg turn at
      # 0.5 rad/s takes ~7 s. 8 s fired BackUp on open floor mid-rotation.
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      stateful: true
    FollowPath:
      # RotationShim is normal path alignment, not a Spin recovery. It keeps
      # deliberate in-place turns at a useful speed, then delegates curves to
      # RPP. Both plugins use this same parameter namespace.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      angular_dist_threshold: 0.20
      angular_disengage_threshold: 0.10
      forward_sampling_distance: 0.30
      # Match the proven manual mapping turn rate. Faster commands amplified
      # the measured ~1.2 s steering-response delay.
      rotate_to_heading_angular_vel: 0.30
      # Open-loop rotation: the closed-loop band tracked the (laggy) measured
      # yaw rate into a ~0.2 rad/s equilibrium, making small turns take 10 s.
      # Open-loop ramps at max_angular_accel and holds rotate_to_heading_angular_vel.
      closed_loop: false
      # RPP's rotateToHeading clamps around the measured yaw rate with
      # +-max_angular_accel*dt (dt = 1/15 s -> +-0.13). At 0.13 rad/s the wheel
      # speed difference is in the motor deadband, so measured stays ~0 and the
      # command never ramped up. 8.0 lets the command reach the 0.5 rad/s cap
      # immediately; the velocity smoother applies the final 0.30 rad/s cap.
      max_angular_accel: 8.0
      simulate_ahead_time: 1.0
      # RPP owns final goal orientation. Keeping this enabled in the shim made
      # its stateless XY check fight RPP when AMCL jitter crossed the XY limit.
      rotate_to_goal_heading: false
      # Rotate in place only when the goal/path first arrives. With false the
      # shim re-checked the 0.30 m sampled point every cycle, and each 1 Hz
      # replan near doors flipped its side: R-L-R-L in-place paddling for
      # 68% of the run time (measured 2026-09-15). RPP handles curves.
      rotate_to_heading_once: true
      use_path_orientations: false

      desired_linear_vel: 0.16
      # At 0.16 m/s, 3 s gives a 0.48 m carrot instead of the former 0.25 m.
      # The longer preview prevents RPP from reversing its correction before
      # Bagheera's measured steering response has settled.
      lookahead_time: 3.0
      transform_tolerance: 0.30
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.40
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.60
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: true
      # Regulate speed only when an obstacle is really close (doors, walls):
      # 0.35 m slowed the robot to the 0.05 m/s crawl inside door frames.
      cost_scaling_dist: 0.20
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      use_rotate_to_heading: true
      # Once XY tolerance has been reached, keep rotating to the requested goal
      # yaw instead of switching back to path tracking after minor pose jitter.
      stateful: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.50
      max_robot_pose_search_dist: 5.0
      use_interpolation: true

      # Calmer arc steering on straights and in curves.
      lookahead_dist: 0.55
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.75

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.30
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.4434, 0.18], [0.4434, -0.18], [-0.0866, -0.18], [-0.0866, 0.18]]"
      # LiDAR-measured limits shifted to axle-centred base_link (front 33 cm,
      # rear 18 cm, sides 17 cm) + 1 cm on each side. The
      # inflation gradient (0.50/3.0) keeps the planner centered between
      # walls; the controller's collision checks + replanning handle the
      # rest - no hard stops.
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          # Kilted defaults the per-source height limit to 0.0 m. Since the
          # LiDAR scan plane is about 0.30 m above the floor, that silently
          # discarded every return even though the layer-level default is 2 m.
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_min_range: 0.30
          obstacle_max_range: 2.5
          raytrace_min_range: 0.30
          raytrace_max_range: 4.0
          observation_persistence: 0.0
          expected_update_rate: 0.20
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 5.0
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: false
      service_introspection_mode: disabled

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.4434, 0.18], [0.4434, -0.18], [-0.0866, -0.18], [-0.0866, 0.18]]"
      footprint_padding: 0.0
      plugins: ["static_layer", "denoise_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      # Remove only tiny artifacts baked into the saved map. The live obstacle
      # layer runs afterwards, so current LiDAR returns remain untouched.
      denoise_layer:
        plugin: nav2_costmap_2d::DenoiseLayer
        enabled: true
        minimal_group_size: 6
        group_connectivity_type: 8
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_min_range: 0.30
          obstacle_max_range: 3.0
          raytrace_min_range: 0.30
          raytrace_max_range: 5.0
          observation_persistence: 0.0
          expected_update_rate: 0.20
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 0.50 circumscribed radius with a gentle 3.0 falloff pushes NavFn
        # paths toward the corridor center; a steep gradient (8) made paths
        # hug the walls and cut corners too tightly.
        inflation_radius: 0.50
        cost_scaling_factor: 3.0
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: false
      service_introspection_mode: disabled

planner_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    expected_planner_frequency: 2.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.20
      use_astar: true
      allow_unknown: false
    service_introspection_mode: disabled

behavior_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: nav2_behaviors::BackUp
      acceleration_limit: 0.20
      deceleration_limit: -0.30
      minimum_speed: 0.05
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.30
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.30
    min_rotational_vel: 0.10
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.16, 0.0, 0.30]
    min_velocity: [-0.08, 0.0, -0.30]
    max_accel: [0.25, 0.0, 2.00]
    max_decel: [-0.35, 0.0, -2.50]
    odom_topic: /odometry/filtered
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

bagheera_autonomy_dock_guard:
  ros__parameters:
    input_topic: /cmd_vel_automatic_raw
    output_topic: /cmd_vel_monitored
    power_topic: /hardware_bridge/power
    odom_topic: /odometry/filtered
    # The original Mowgli stack also uses 10 V as the electrical distinction
    # between physically connected to the charger and away from the dock.
    dock_voltage_threshold: 10.0
    dock_debounce_s: 1.0
    command_timeout_s: 0.5
    reverse_distance_m: 0.80
    reverse_speed_mps: 0.08
    reverse_timeout_s: 18.0
    reverse_heading_kp: 1.5
    reverse_cross_track_kp: 1.0
    reverse_max_angular_rps: 0.25
    turn_angle_rad: 1.5707963267948966
    # Same deliberately reduced angular speed used for manual mapping.
    turn_max_speed_rps: 0.30
    turn_min_speed_rps: 0.16
    turn_gain: 0.8
    turn_tolerance_rad: 0.03490658503988659
    turn_timeout_s: 10.0
    settle_time_s: 0.30

keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    yaml_filename: /bagheera_ws/maps/keepout_mask.yaml
    topic_name: /keepout_filter_mask
    frame_id: map

localization_exclusion_mask_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    yaml_filename: /bagheera_ws/maps/localization_exclusion_mask.yaml
    topic_name: /localization_exclusion_mask
    frame_id: map

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    type: 0
    filter_info_topic: /costmap_filter_info
    mask_topic: /keepout_filter_mask_live
    base: 0.0
    multiplier: 1.0

bagheera_localization_exclusion_guard:
  ros__parameters:
    mask_topic: /localization_exclusion_mask
    occupied_threshold: 50
    reset_cooldown_s: 1.0

bagheera_keepout_mask_relay:
  ros__parameters:
    input_topic: /keepout_filter_mask
    output_topic: /keepout_filter_mask_live
