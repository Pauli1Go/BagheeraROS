bt_navigator:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 100
    wait_for_service_timeout: 5000
    service_introspection_mode: disabled
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
      enable_groot_monitoring: false
      groot_server_port: 1667
    bt_search_directories:
      - /opt/ros/kilted/share/nav2_bt_navigator/behavior_trees
    error_code_name_prefixes:
      - backup
      - compute_path
      - follow_path
      - nav_to_pose
      - wait

controller_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    enable_stamped_cmd_vel: true
    controller_frequency: 15.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker", "precise_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      # Unlike SimpleProgressChecker, this counts an in-place turn as real
      # progress and therefore does not trigger recovery during final yaw
      # alignment. A robot that does not translate or rotate still times out.
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.08
      required_movement_angle: 0.10
      # In-place rotations are legitimate progress: a 180 deg turn at
      # 0.5 rad/s takes ~7 s. 8 s fired BackUp on open floor mid-rotation.
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      stateful: true
    # Only for the docking staging pose (behavior_trees/navigate_to_staging.xml):
    # the same precision as the docking server's own return to staging.
    precise_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.05
      # bagheera_dock_trigger then turns the last degrees slowly (to 1.5 deg).
      yaw_goal_tolerance: 0.08726646259971647  # 5 deg
      stateful: true
    FollowPath:
      # RotationShim is normal path alignment, not a Spin recovery. It keeps
      # deliberate in-place turns at a useful speed, then delegates curves to
      # RPP. Both plugins use this same parameter namespace.
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      angular_dist_threshold: 0.20
      angular_disengage_threshold: 0.10
      forward_sampling_distance: 0.30
      # Match the proven manual mapping turn rate. Faster commands amplified
      # the measured ~1.2 s steering-response delay.
      rotate_to_heading_angular_vel: 0.30
      # Open-loop rotation: the closed-loop band tracked the (laggy) measured
      # yaw rate into a ~0.2 rad/s equilibrium, making small turns take 10 s.
      # Open-loop ramps at max_angular_accel and holds rotate_to_heading_angular_vel.
      closed_loop: false
      # RPP's rotateToHeading clamps around the measured yaw rate with
      # +-max_angular_accel*dt (dt = 1/15 s -> +-0.13). At 0.13 rad/s the wheel
      # speed difference is in the motor deadband, so measured stays ~0 and the
      # command never ramped up. 8.0 lets the command reach the 0.5 rad/s cap
      # immediately; the velocity smoother applies the final 0.30 rad/s cap.
      max_angular_accel: 8.0
      simulate_ahead_time: 1.0
      # RPP owns final goal orientation. Keeping this enabled in the shim made
      # its stateless XY check fight RPP when AMCL jitter crossed the XY limit.
      rotate_to_goal_heading: false
      # Rotate in place only for initial path alignment. A fresh 1 Hz plan
      # must not restart the shim's turn at every doorway update.
      rotate_to_heading_once: true
      use_path_orientations: false

      desired_linear_vel: 0.16
      # At 0.16 m/s, 3 s gives a 0.48 m carrot instead of the former 0.25 m.
      # The longer preview prevents RPP from reversing its correction before
      # Bagheera's measured steering response has settled.
      lookahead_time: 3.0
      transform_tolerance: 0.30
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.40
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.60
      regulated_linear_scaling_min_speed: 0.05
      use_cost_regulated_linear_velocity_scaling: true
      # Regulate speed only when an obstacle is really close (doors, walls):
      # 0.35 m slowed the robot to the 0.05 m/s crawl inside door frames.
      cost_scaling_dist: 0.20
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 5.0
      use_rotate_to_heading: true
      # Once XY tolerance has been reached, keep rotating to the requested goal
      # yaw instead of switching back to path tracking after minor pose jitter.
      stateful: true
      allow_reversing: false
      # Above 20 deg to the carrot, turn on the spot first instead of an arc.
      # At 0.50 rad a robot 27 deg off the path at a door projected a straight
      # 0.4 m arc whose front corner touched the door frame: RPP reported
      # "collision ahead" from standstill on every retry although the path
      # itself kept 19 cm clearance (2026-09-24). Smaller angles keep arcs.
      rotate_to_heading_min_angle: 0.35
      max_robot_pose_search_dist: 5.0
      use_interpolation: true

      # Calmer arc steering on straights and in curves.
      lookahead_dist: 0.55
      min_lookahead_dist: 0.45
      max_lookahead_dist: 0.75

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.30
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.4434, 0.18], [0.4434, -0.18], [-0.0866, -0.18], [-0.0866, 0.18]]"
      # LiDAR-measured limits shifted to axle-centred base_link (front 33 cm,
      # rear 18 cm, sides 17 cm) + 1 cm on each side. The
      # inflation gradient (0.50/3.0) keeps the planner centered between
      # walls; the controller's collision checks + replanning handle the
      # rest - no hard stops.
      footprint_padding: 0.0
      plugins: ["obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          # Kilted defaults the per-source height limit to 0.0 m. Since the
          # LiDAR scan plane is about 0.30 m above the floor, that silently
          # discarded every return even though the layer-level default is 2 m.
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          # Accept every valid ray the G2 publishes. Its specified minimum
          # range is 0.28 m; do not add another software blind ring.
          obstacle_min_range: 0.0
          obstacle_max_range: 2.5
          raytrace_min_range: 0.0
          raytrace_max_range: 4.0
          observation_persistence: 0.0
          expected_update_rate: 0.20
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.25
        cost_scaling_factor: 5.0
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: false
      service_introspection_mode: disabled

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.30
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.4434, 0.18], [0.4434, -0.18], [-0.0866, -0.18], [-0.0866, 0.18]]"
      footprint_padding: 0.0
      plugins: ["static_layer", "denoise_layer", "obstacle_layer", "inflation_layer"]
      filters: ["keepout_filter"]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      # Remove only tiny artifacts baked into the saved map. The live obstacle
      # layer runs afterwards, so current LiDAR returns remain untouched.
      denoise_layer:
        plugin: nav2_costmap_2d::DenoiseLayer
        enabled: true
        minimal_group_size: 6
        group_connectivity_type: 8
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          clearing: true
          marking: true
          min_obstacle_height: 0.0
          max_obstacle_height: 1.0
          obstacle_min_range: 0.0
          obstacle_max_range: 3.0
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0
          observation_persistence: 0.0
          expected_update_rate: 0.20
          inf_is_valid: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        # 0.50 circumscribed radius with a gentle 3.0 falloff pushes NavFn
        # paths toward the corridor center; a steep gradient (8) made paths
        # hug the walls and cut corners too tightly.
        inflation_radius: 0.50
        cost_scaling_factor: 3.0
      keepout_filter:
        plugin: nav2_costmap_2d::KeepoutFilter
        enabled: true
        filter_info_topic: /costmap_filter_info
      always_send_full_costmap: false
      service_introspection_mode: disabled

planner_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    expected_planner_frequency: 1.0
    costmap_update_timeout: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.20
      use_astar: true
      allow_unknown: false
    service_introspection_mode: disabled

behavior_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["backup", "wait"]
    backup:
      plugin: nav2_behaviors::BackUp
      acceleration_limit: 0.20
      deceleration_limit: -0.30
      minimum_speed: 0.05
    wait:
      plugin: nav2_behaviors::Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.30
    simulate_ahead_time: 1.5
    max_rotational_vel: 0.30
    min_rotational_vel: 0.10
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.16, 0.0, 0.30]
    min_velocity: [-0.08, 0.0, -0.30]
    max_accel: [0.25, 0.0, 2.00]
    max_decel: [-0.35, 0.0, -2.50]
    odom_topic: /odometry/filtered
    odom_duration: 0.2
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

bagheera_autonomy_dock_guard:
  ros__parameters:
    input_topic: /cmd_vel_automatic_raw
    output_topic: /cmd_vel_monitored
    power_topic: /hardware_bridge/power
    odom_topic: /odometry/filtered
    # The original Mowgli stack also uses 10 V as the electrical distinction
    # between physically connected to the charger and away from the dock.
    dock_voltage_threshold: 10.0
    dock_debounce_s: 1.0
    # Gate autonomy already at first contact; 10 V follows seconds later.
    contact_voltage_threshold: 0.5
    command_timeout_s: 0.5
    reverse_distance_m: 0.80
    reverse_speed_mps: 0.08
    # A fixed 18 s limit aborted a slow (0.045 m/s) but steady undock on
    # 2026-09-24. Now: abort when the path gains < 5 cm in 5 s; 60 s backstop.
    reverse_timeout_s: 60.0
    reverse_stall_window_s: 5.0
    reverse_stall_min_progress_m: 0.05
    reverse_heading_kp: 1.5
    reverse_cross_track_kp: 1.0
    reverse_max_angular_rps: 0.25
    turn_angle_rad: 1.5707963267948966
    # Same deliberately reduced angular speed used for manual mapping.
    turn_max_speed_rps: 0.30
    turn_min_speed_rps: 0.30
    turn_gain: 0.8
    turn_tolerance_rad: 0.03490658503988659
    turn_timeout_s: 15.0
    settle_time_s: 0.30

dock_apriltag:
  ros__parameters:
    # Consume the camera's JPEG stream directly. Relaying 960x540 mono8
    # images over DDS produced only 0-3 frames/10 s at this subscriber,
    # despite the relay publishing 10 Hz.
    image_transport: compressed
    family: Standard41h12
    # AprilTag pose size is the detected black/white border, not the outside
    # edge of the printed 9-cell tag: tagStandard41h12 uses 5/9 of it.
    size: 0.026667
    max_hamming: 0
    profile: false
    # The Kilted binary requires a valid method even though Bagheera ignores
    # its pinhole pose and computes fisheye geometry from the raw corners.
    pose_estimation_method: pnp
    qos_profile: sensor_data
    detector:
      # A full 1080p quad search saturated the four-core Pi. The source is
      # 1920x1080; 2x decimation preserves the former 960x540 search scale.
      threads: 2
      decimate: 2.0
      blur: 0.0
      refine: true
      sharpening: 0.25
      debug: false
    tag:
      ids: [0, 1]
      frames: [dock_tag_far, dock_tag_near]
      sizes: [0.088889, 0.026667]

docking_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    # The dock is static in odom; map corrections from AMCL would move it.
    fixed_frame: odom
    base_frame: base_link
    odom_topic: /odometry/filtered
    controller_frequency: 20.0
    # Camera start (~2.4 s) plus AprilTag latency (~0.9 s) on the Pi.
    initial_perception_timeout: 10.0
    dock_approach_timeout: 40.0
    # Includes bagheera_dock_trigger's straight final approach (~3 s) and the
    # charger ramp to the debounced 10 V /docked (several seconds).
    wait_charge_timeout: 20.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.05
    max_retries: 2
    # Closer than this to the staging pose: start visually without Nav2.
    dock_prestaging_tolerance: 0.15
    # Staging navigation uses the precise goal checker (5 cm / 5 deg);
    # bagheera_dock_trigger turns the final degrees slowly afterwards.
    navigator_bt_xml: /bagheera_ws/install/share/bagheera_base/behavior_trees/navigate_to_staging.xml

    dock_plugins: ["bagheera_dock"]
    bagheera_dock:
      plugin: bagheera_docking::TagChargingDock
      # Staging pose = robot pose measured on 2026-09-23 with both tags in
      # view: map (1.218, 1.252, 1.607 rad), expressed relative to home_dock
      # (recomputed for the corrected dock yaw; same map pose as before).
      staging_x_offset: -0.6325
      staging_y_offset: 0.0076
      staging_yaw_offset: -0.0170
      # ID 1 (dock) -> base_link at electrical contact, in the dock frame.
      # x: the docked camera image shows ID 1's 26.67 mm border ~840 px wide,
      # i.e. ~3.5 cm camera depth; camera 0.4334 m ahead of base_link.
      # (bagheera_dock_calibrate's x is unusable: odom slips leaving the dock.)
      external_detection_translation_x: -0.468
      # y and yaw: bagheera_dock_calibrate on 2026-09-23, mean of 10 stops
      # 0.18-0.64 m from the dock (spread +-1 cm / +-0.5 deg).
      external_detection_translation_y: 0.002
      # ID 0 (wall) direction -> robot heading when docked.
      axis_yaw_offset: 0.0055
      require_axis_tag: true
      # AprilTag results arrive 0.9-1.1 s after exposure and then wait up to
      # 0.3 s for the next control cycle. The dock is static in odom, so older
      # measurements stay valid; 1.5 s aborted approaches as "ID 1 lost".
      detection_timeout: 3.0
      position_filter_coef: 0.3
      yaw_filter_coef: 0.2
      max_position_jump: 0.10
      max_yaw_jump: 0.17
      # ID 1 leaves the image ~4 cm before contact: hold its last pose there.
      hold_distance: 0.30
      # Nav2's curve ends at this pre-dock pose on the dock axis, in front of
      # contact; bagheera_dock_trigger drives the rest straight. At the pins
      # the curve was still turning (+-14 deg, contacts 3 cm off); at 12 cm
      # it still sometimes missed the dock's floor rail, hence 17 cm.
      pre_dock_distance: 0.17
      # Off-axis at the pre-dock line: report a lost detection so that Nav2
      # retries from staging at once instead of waiting 20 s for charge. It
      # docked with the pins 1.5 cm off axis; the straight drive trims ~1 cm.
      pre_dock_max_lateral: 0.025
      pre_dock_max_yaw: 0.17453292519943295  # 10 deg
      contact_voltage: 0.5

    docks: ["home_dock"]
    home_dock:
      type: bagheera_dock
      frame: map
      # AMCL position measured with base_link parked in the dock; yaw is the
      # tag-derived dock axis (see bagheera_pose_persistence). Only the
      # staging pose is derived from it; the approach uses the tags.
      pose: [1.192, 1.884, 1.624]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.10
      v_angular_max: 0.30
      slowdown_radius: 0.25
      use_collision_detection: true
      costmap_topic: /local_costmap/costmap_raw
      footprint_topic: /local_costmap/published_footprint
      transform_tolerance: 0.3
      projection_time: 5.0
      simulation_time_step: 0.1
      # Measured from the controller target 0.25 m beyond the dock pose:
      # the last 15 cm before contact are not collision checked, because
      # the dock and wall lie right in front of the chassis there.
      dock_collision_threshold: 0.40

bagheera_goal_pose_bridge:
  ros__parameters:
    # Same footprint as the costmaps: a Foxglove goal is rejected when the
    # oriented robot (not only its axle point) would overlap a wall, unknown
    # map or keepout cell in its final pose.
    footprint: "[[0.4434, 0.18], [0.4434, -0.18], [-0.0866, -0.18], [-0.0866, 0.18]]"
    map_occupied_threshold: 65

bagheera_dock_frame_gate:
  ros__parameters:
    result_timeout_s: 1.0

bagheera_dock_tag_pose:
  ros__parameters:
    position_tag_id: 1
    position_tag_size_m: 0.026667
    axis_tag_id: 0
    axis_tag_size_m: 0.088889
    minimum_decision_margin: 15.0
    minimum_edge_pixels: 16.0
    # ID 0 measured 113 px / 0.35 deg std at the staging pose.
    minimum_axis_edge_pixels: 60.0
    maximum_axis_heading_rad: 0.5235987755982988
    camera_frame: camera_optical_frame

bagheera_dock_trigger:
  ros__parameters:
    dock_id: home_dock
    max_staging_time_s: 120.0
    # Straight final approach from the plugin's pre-dock pose to the pins.
    final_speed_mps: 0.05
    final_overtravel_m: 0.03
    final_heading_gain: 1.2
    final_trim_max_rad: 0.06981317007977318  # 4 deg
    final_trim_distance_m: 0.25
    final_max_angular_rps: 0.20
    # Charging contacts ahead of base_link (for logging the pin offset).
    final_front_offset_m: 0.47
    # Hand-over limits. The heading is turned back during the straight drive
    # (the curve still swings +-7 deg); an axle offset is not, so a larger
    # one skips the drive and Nav2 retries from the staging pose.
    final_max_lateral_m: 0.025
    final_max_yaw_rad: 0.17453292519943295  # 10 deg
    final_timeout_s: 8.0
    contact_voltage: 0.5

keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    yaml_filename: /bagheera_ws/maps/keepout_mask.yaml
    topic_name: /keepout_filter_mask
    frame_id: map

localization_exclusion_mask_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    yaml_filename: /bagheera_ws/maps/localization_exclusion_mask.yaml
    topic_name: /localization_exclusion_mask
    frame_id: map

costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    bond_heartbeat_period: 1.0
    type: 0
    filter_info_topic: /costmap_filter_info
    mask_topic: /keepout_filter_mask_live
    base: 0.0
    multiplier: 1.0

bagheera_localization_exclusion_guard:
  ros__parameters:
    mask_topic: /localization_exclusion_mask
    occupied_threshold: 50
    reset_cooldown_s: 1.0

bagheera_keepout_mask_relay:
  ros__parameters:
    input_topic: /keepout_filter_mask
    output_topic: /keepout_filter_mask_live
    # Re-sent once to every new subscriber: after a boot foxglove_bridge often
    # subscribes VOLATILE before it knows the map servers and misses their
    # single publication.
    repeat_topics: ["/keepout_filter_mask", "/localization_exclusion_mask"]
