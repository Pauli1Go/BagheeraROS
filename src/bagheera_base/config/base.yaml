bagheera_base_driver:
  ros__parameters:
    port: /dev/mowgli
    baud_rate: 115200
    reconnect_interval: 2.0
    command_rate: 20.0
    command_timeout: 0.5
    allow_unsafe_firmware: false
    odom_frame: odom
    base_frame: base_link
    external_imu_frame: imu_link
    onboard_imu_frame: base_link
    publish_tf: true

bagheera_controller:
  ros__parameters:
    cmd_vel_topic: /cmd_vel_teleop
    joystick_index: 0
    steering_axis: 2
    throttle_axis: 3
    deadman_button: 4
    deadzone: 0.05
    # Firmware limit for the YardForce 500 drive base.
    max_linear_speed: 0.50
    max_angular_speed: 1.50
    publish_rate: 20.0
    joystick_rescan_interval: 1.0
