bagheera_base_driver:
  ros__parameters:
    port: /dev/mowgli
    baud_rate: 115200
    reconnect_interval: 2.0
    command_rate: 20.0
    command_timeout: 0.5
    allow_unsafe_firmware: false
    odom_frame: odom
    base_frame: base_link
    external_imu_frame: imu_link
    onboard_imu_frame: base_link
    publish_tf: true
    axle_to_base_link_m: 0.0

bagheera_battery_monitor:
  ros__parameters:
    power_topic: /hardware_bridge/power
    # Correction of the firmware's v_battery, measured on this robot only
    # (2026-09-24, MowgliNext firmware 1.9.10, multimeter at the pack):
    # 25.71/28.10/28.37 V real vs. 26.49/28.90/29.20 V reported. Constant
    # offset, no gain error. Re-measure after a board or firmware change.
    voltage_offset_v: -0.80
    cell_count: 7
    filter_window_s: 60.0
    warmup_s: 10.0
    # 7S Li-Ion, corrected pack voltage: ~20 % -> LOW (return to the dock),
    # ~10 % -> CRITICAL (return immediately). Both latch until charging.
    low_voltage: 25.3
    critical_voltage: 24.5
    dock_voltage_threshold: 10.0
    charging_current_a: 0.2
    # FULL: docked, averaged voltage >= full_voltage and charge current below
    # full_current_a for full_hold_s. The firmware limits charging to 29.4 V
    # as it measures it, i.e. about 28.6 V real.
    full_voltage: 28.4
    full_current_a: 0.15
    full_hold_s: 120.0
    full_release_voltage: 28.0
    publish_rate: 1.0

bagheera_controller:
  ros__parameters:
    cmd_vel_topic: /cmd_vel_teleop
    joystick_index: 0
    steering_axis: 2
    throttle_axis: 1
    deadman_button: 4
    deadzone: 0.05
    # Conservative manual-mapping limits. At the G2B's ~9.6 Hz scan rate
    # these stay near 1.7 cm and 1.8 degrees of motion per scan.
    max_linear_speed: 0.16
    max_angular_speed: 0.30
    publish_rate: 20.0
    joystick_rescan_interval: 1.0
