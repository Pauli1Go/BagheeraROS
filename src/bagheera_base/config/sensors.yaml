ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    frame_id: lidar_link
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    sample_rate: 5
    intensity_bit: 8
    abnormal_check_count: 4
    # A G2B varies slightly around its nominal 500 samples/revolution.
    # Preserve every measured point instead of truncating scans to 530 points.
    fixed_resolution: false
    reversion: false
    # The G2 is mounted with its native clockwise scan direction.  ROS laser
    # scans use counter-clockwise-positive angles, so reverse the ray order.
    inverted: true
    auto_reconnect: true
    isSingleChannel: false
    intensity: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 16.0
    # Requested close-range trial. G2 nominal minimum is 0.28 m; readings
    # between 0.20 and 0.28 m must be checked against the real /scan data.
    range_min: 0.20
    frequency: 10.0
    invalid_range_is_inf: true
    debug: false

bagheera_dock_sleep:
  ros__parameters:
    # Docked (debounced 10 V charge voltage) without any motion command for
    # this long: LiDAR (driver process stopped), WT901 polling, PMW3901
    # (shutdown, LED off) and camera sleep.
    sleep_delay_s: 3.0
    # After a wake-up stay awake at least this long, so a held goal or the
    # teleop driver can leave the dock before the 3 s idle rule applies.
    wake_grace_s: 30.0
    lidar_executable: /bagheera_ws/install/lib/ydlidar_ros2_driver/ydlidar_ros2_driver_node
    lidar_parameters: /bagheera_ws/install/share/bagheera_base/config/sensors.yaml
    # Wake-up is done once /scan runs at >= 8 Hz for 2 s, the WT901 has
    # re-measured its bias (200 samples, 4 s) and the flow sensor reports.
    scan_window_s: 2.0
    scan_min_rate_hz: 8.0
    sensor_timeout_s: 30.0
    ekf_settle_s: 0.5
    anchor_timeout_s: 15.0

bagheera_optical_flow:
  ros__parameters:
    spi_bus: 0
    spi_chip_select: 0
    spi_speed_hz: 400000
    frame_id: base_link
    # PMW motion deltas accumulate between reads. 25 Hz matches the EKF rate;
    # at 0.16 m/s each sample is only about 35 counts, so no resolution is lost.
    publish_rate: 25.0
    mount_height_m: 0.09
    # Calibrated at 90 mm height: 2755 X-counts over 0.510 m.
    radians_per_count: 0.002057
    swap_xy: false
    invert_x: false
    invert_y: false
    minimum_quality: 0
    # The PMW3901 is 18.34 cm ahead and 1.10 cm left of axle-centred base_link. Remove its circular
    # sweep during pivots so the published twist describes base_link.
    lever_arm_x: 0.1834103944436625
    lever_arm_y: 0.011005001769871877
    rotation_gate_enabled: true
    # Reject PMW translation during any deliberate turn. The previous 0.25
    # rad/s threshold let samples through while accelerating/decelerating and
    # seeded a persistent false lateral EKF velocity.
    rotation_gate_rad_s: 0.08
    imu_topic: /imu/wt901/data_raw
    imu_max_age: 0.5

bagheera_wt901:
  ros__parameters:
    i2c_bus: 1
    i2c_address: 80  # 0x50
    publish_rate: 50.0
    frame_id: imu_link
    # Four seconds at 50 Hz. The robot must remain still during startup.
    gyro_calibration_samples: 200
    angular_velocity_variance: 0.0001
    linear_acceleration_variance: 0.04
    # Live register 0x72 reported WITMotion magnetometer type 6.
    mag_sensor_type: 6
    magnetic_field_variance: 2.5e-11

bagheera_compass:
  ros__parameters:
    calibration_file: /bagheera_ws/maps/compass_calibration.yaml
    # imu_link is mounted with physical Y+ pointing along base_link X+.
    sensor_to_base_yaw: -1.5707963267948966
    output_frame: base_link
    # Office steel, motors and current wiring can perturb the field. Invalid
    # samples are withheld from the EKF instead of pulling odom sideways.
    field_tolerance_fraction: 0.35
    acceleration_tolerance_fraction: 0.30
    heading_variance: 0.12
    filter_gain: 0.12
    max_heading_rate_rad_s: 1.5
    imu_max_age: 0.25

bagheera_measurement_normalizer:
  ros__parameters:
    odom_frame_id: odom
    base_frame_id: base_link
    # MowgliNext wheel twist already describes axle-centred base_link.
    axle_to_base_link_m: 0.0
    imu_frame_id: imu_link
    camera_frame_id: camera_optical_frame
    camera_width: 1920
    camera_height: 1080
    # Provisional pinhole model for Foxglove visualization only. Replace all
    # four values after a real fisheye calibration before using camera geometry.
    camera_nominal_fx: 960.0
    camera_nominal_fy: 960.0
    camera_nominal_cx: 960.0
    camera_nominal_cy: 540.0
    # Variances follow the 6D ROS order x/y/z/roll/pitch/yaw. Unobserved
    # 3D axes are deliberately large instead of incorrectly claiming zero
    # uncertainty. These are conservative starting values pending a rosbag
    # noise characterization.
    wheel_pose_variance: [0.04, 0.09, 1000000.0, 1000000.0, 1000000.0, 0.09]
    wheel_twist_variance: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.0009]
    imu_orientation_variance: [0.0027, 0.0027, 0.01]
    imu_angular_velocity_variance: [0.0004, 0.0004, 0.0004]
    imu_linear_acceleration_variance: [0.04, 0.04, 0.04]

camera:
  ros__parameters:
    camera: 0
    role: viewfinder
    # The patched camera_ros publishes only NV21's full-resolution luminance
    # plane as mono8 and encodes grayscale JPEG directly from that plane.
    format: NV21
    width: 1920
    height: 1080
    # 15 FPS is the limit of the full-FOV 2592x1944 sensor mode. Frame
    # durations are in microseconds.
    FrameDurationLimits: [66666, 66666]
    # Software JPEG for AprilTag docking only (7.5 FPS, ~70 % of one core
    # while subscribed). Detection runs at ~5 frames/s on the Pi 4.
    jpeg_quality: 20
    jpeg_frame_divisor: 2
    # Colour H.264 on the Pi 4 hardware encoder for Foxglove (/camera/h264,
    # ~17 % of one core at 15 FPS). Encoded only while subscribed; one
    # keyframe per second lets a new viewer start within a second.
    h264_device: /dev/video11
    h264_bitrate: 2000000
    h264_intra_period: 15
    h264_framerate: 15
    camera_info_url: "file:///bagheera_ws/install/share/bagheera_base/config/camera_fisheye.yaml"
    # Force the complete 4:3 sensor area so the fisheye field of view is kept.
    sensor_mode: "2592:1944"
    orientation: 180
    frame_id: camera_optical_frame
    use_node_time: false
    # Ignore bright sunlight near the dock tags and expose the central docking
    # area one stop brighter. Keep AE enabled so changing daylight is handled.
    AeMeteringMode: 1
    ExposureValue: 1.0
    AwbEnable: true
    AwbMode: 0
