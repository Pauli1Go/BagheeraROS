ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    frame_id: lidar_link
    ignore_array: ""
    baudrate: 230400
    lidar_type: 1
    device_type: 0
    sample_rate: 5
    intensity_bit: 8
    abnormal_check_count: 4
    # A G2B varies slightly around its nominal 500 samples/revolution.
    # Preserve every measured point instead of truncating scans to 530 points.
    fixed_resolution: false
    reversion: false
    inverted: false
    auto_reconnect: true
    isSingleChannel: false
    intensity: true
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 16.0
    range_min: 0.28
    frequency: 10.0
    invalid_range_is_inf: true
    debug: false

bagheera_optical_flow:
  ros__parameters:
    spi_bus: 0
    spi_chip_select: 0
    spi_speed_hz: 400000
    frame_id: base_link
    publish_rate: 100.0
    mount_height_m: 0.09
    # Calibrated at 90 mm height: 2755 X-counts over 0.510 m.
    radians_per_count: 0.002057
    swap_xy: false
    invert_x: false
    invert_y: false
    minimum_quality: 0

camera:
  ros__parameters:
    camera: 0
    role: viewfinder
    # camera_ros maps libcamera RGB byte order to ROS bgr8 for OpenCV users.
    format: RGB888
    width: 1920
    height: 1080
    # Force the complete 4:3 sensor area so the fisheye field of view is kept.
    sensor_mode: "2592:1944"
    orientation: 180
    frame_id: camera_optical_frame
    use_node_time: true
    AwbEnable: true
    AwbMode: 0
