collision_monitor:
  ros__parameters:
    use_sim_time: false
    enabled: true
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_smoothed
    cmd_vel_out_topic: /cmd_vel_monitored
    state_topic: /collision_monitor_state
    enable_stamped_cmd_vel: true
    transform_tolerance: 0.3
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0

    # Navigation-only safety monitor (teleop bypasses it via the mux).
    # Slowdown starts ~35 cm out so turns near walls brake early; the stop
    # polygon is deliberately tight (footprint + a few cm) so it only fires
    # when a collision is imminent. Chain: smoother -> collision_monitor ->
    # twist_mux -> hardware.
    polygons: ["SlowDown", "LidarStop"]
    SlowDown:
      type: polygon
      action_type: slowdown
      slowdown_ratio: 0.5
      points: "[[0.72, 0.35], [0.72, -0.35], [-0.32, -0.35], [-0.32, 0.35]]"
      min_points: 4
      visualize: true
      polygon_pub_topic: /collision_monitor/slowdown_zone
      enabled: true
    LidarStop:
      type: polygon
      action_type: stop
      # Axle-centred chassis is x=[-0.18, 0.33], y=[-0.17, 0.17].
      # These dormant limits include the requested 1 cm safety margin.
      points: "[[0.34, 0.18], [0.34, -0.18], [-0.19, -0.18], [-0.19, 0.18]]"
      min_points: 6
      visualize: true
      polygon_pub_topic: /collision_monitor/stop_zone
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: scan
      topic: /scan
      source_timeout: 0.5
      enabled: true
