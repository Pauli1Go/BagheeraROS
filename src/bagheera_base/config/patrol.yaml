bagheera_patrol:
  ros__parameters:
    # Paths are site data: one file per path in this folder (maps/paths on
    # the host, not in git), made with `ros2 run bagheera_base bagheera_paths create NAME ...` and
    # started with /patrol/<name>. See docs/operation.md#waypoint-patrol.
    paths_dir: /bagheera_ws/maps/paths
    # dock_cycle mode: time in the dock between two laps.
    dock_pause_s: 60.0
    # /dock/trigger attempts per docking (each already includes Nav2's own
    # three docking retries) before the patrol stops.
    dock_attempts: 3
    # A waypoint Nav2 aborts (its BT gives up after 2 recoveries)
    # is skipped. This many skips in a row: dock and stop.
    max_consecutive_failures: 3
    # Costmap timeouts, TF errors, rejected goals and planner failures mean
    # late navigation data, not an unreachable waypoint: drive to the same
    # waypoint again after retry_delay_s, up to this many times, before it
    # counts as a skip. Patience/progress/collision aborts skip at once.
    max_transient_retries: 2
    retry_delay_s: 3.0
    # Safety net above the BT's own abort.
    waypoint_timeout_s: 600.0
    wake_timeout_s: 90.0
    # Docked start: the dock guard reverses out (/dock/undock) before the first
    # Nav2 goal is sent; fail if it has not reported CLEAR within this time.
    undock_timeout_s: 60.0
    dock_start_timeout_s: 5.0
    # Stop in the dock when FULL is not reached within this time.
    max_charge_s: 21600.0
    # Bind-mounted to ./test_logs on the host (compose.yaml).
    log_dir: /bagheera_ws/test_logs
